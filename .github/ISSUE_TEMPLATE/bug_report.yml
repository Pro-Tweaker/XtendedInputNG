name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: dropdown
    id: game
    attributes:
      label: Game
      options: [Underground, Underground 2, Most Wanted, Carbon, Pro Street, Undercover, World]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plugin version
      description: Release tag, or commit hash if built from source
    validations:
      required: true
  - type: input
    id: controller
    attributes:
      label: Controller and backend
      description: For example DualSense on SDL3, Xbox 360 pad on XInput
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: log
    attributes:
      label: scripts/XtendedInputNG.log
      description: Paste the log or attach it as a file
      render: text
  - type: textarea
    id: other
    attributes:
      label: Other ASI plugins / mods in use
