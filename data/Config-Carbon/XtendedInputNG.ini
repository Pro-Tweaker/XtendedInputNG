[Input]
Backend = SDL                                              ; gamepad API: SDL (default, also reads DualShock/DualSense, Switch Pro, etc; needs scripts/SDL3.dll, falls back to XInput if missing) or XInput
IgnoreDevices =                                            ; SDL only: VID/PID pairs to hide, e.g. 0x045e/0x028e hides a wrapper's (Steam Input, DS4Windows) virtual Xbox pad when the real pad shows up twice. Empty = hide nothing
KeyboardReadingMode = 0                                   ; 0 = async unbuffered, 1 = buffered
XInputOmniMode = 0                                        ; reads from all 4 XInput ports at the same time to the player 1 and 2 inputs
PassConnStatus = 1                                        ; passes the connection status of the controller to the game, so when you disconnect the controller the game will pause like in the console versions
ConfineMouse = 0                                          ; confine mouse within the game window
UseWin32Cursor = 1                                        ; use Win32/OS to render the mouse (recommended for performance benefits)
UseCustomCursor = 1                                       ; use the nfs_cursor.cur file as the cursor style
EnableMouseHiding = 1                                     ; enables automatic mouse hiding after 5 seconds
MouseLook = 1                                             ; use mouse for looking during DebugWorldCamera (this will stick and hide the cursor to the window center during the camera)
MouseLookSensitivity = 1.0                                ; sets the mouse sensitivity for mouse look

[Deadzone]
; set the percentage of deadzone for each stick here (default 24% = 0.24)
RadialDeadzone = 1                                        ; 1 = circular deadzone, stick range rescaled to full (diagonals reach 1.0); 0 = old per-axis cut
PercentLS = 0.24                                          ; left stick deadzone
PercentRS = 0.24								          ; right stick deadzone
PercentLS_P2 = 0.24								          ; left stick deadzone (Port 2)
PercentRS_P2 = 0.24								          ; right stick deadzone (Port 2)
Percent_Shifting = 0.75                                   ; deadzone for shifting digital activation (how far you need to press the trigger for it to register)
Percent_AnalogStickDigital = 0.50                         ; deadzone for analog sticks digital activation
Percent_AnalogTriggerDigital = 0.12                       ; same for triggers

[Camera]
; right-stick orbit of the in-race chase camera. Turn the Widescreen Fix's own [CAMERA] Enable off (= 0) when using this, they can't both run
Enable = 1                                                ; 1 = enable (on by default)
StickLookSensitivity = 1.0                                ; degrees per frame (at 60 fps) at full deflection
ReturnTimeout = 3.0                                       ; seconds without input before the camera swings back behind the car
ReturnSpeed = 2.0
InvertLook = 0
OnlyAllowHorizontalStickMovement = 0                      ; 1 = left/right only. Axes already bound to a driving action (e.g. up/down = shifting in the default bindings) are skipped automatically
ReturnOnRelease = 0                                       ; 1 = camera swings straight back behind the car when you let go of the stick (ignores ReturnTimeout)
MouseLook = 1                                             ; the mouse orbits the camera too (cursor is hidden and held at the window centre while driving)
MouseLookSensitivity = 1.0
StickCurve = 1.0                                          ; 1 = linear, 2 = finer control near the centre of the stick
PitchMin = -30                                            ; vertical limits in degrees relative to the game's own camera
PitchMax = 60
RecenterOnStickClick = 1                                  ; pressing the right stick (R3) snaps the camera back, if R3 has no other binding
Debug = 0                                                 ; 1 = write camera mode/stick values to the log once a second

[Rumble]
; Pad vibration while racing, derived from the player's car (the game has none on PC). Carbon only for now
Enable = 1                                                ; 1 = on
Strength = 1.0                                            ; overall scale, 0 = off, up to 2
Road = 0.15                                               ; road/engine rumble at full speed
NOS = 0.5                                                 ; rumble while the NOS button is held
Impact = 1.0                                              ; pulse when the car hits something
OnlyWhileRacing = 1                                       ; 0 = also in menus (nothing to feel there)
Debug = 0                                                 ; 1 = log speed and detected impacts once a second

[Triggers]
; DualSense adaptive triggers (needs Backend = SDL and a PS5 pad, other pads ignore this)
Enable = 0                                                ; 1 = enable
OnlyWhileRacing = 1                                       ; 0 = also in menus
; effects: Off | Feedback <pos 0-9> <strength 1-8> | Weapon <start 2-7> <end 3-8> <strength 1-8> | Vibration <pos 0-9> <amplitude 1-8> <frequency 1-255> | Slope <start 0-8> <end 1-9> <start strength 1-8> <end strength 1-8>
LeftTrigger = Slope 1 8 2 7                               ; brake: resistance that builds up the further you pull
RightTrigger = Feedback 4 2                               ; throttle: light resistance in the second half of the pull

[Icons]
ControllerIconMode = 0                                    ; -1 = follow the connected pad (SDL backend), 0 = Xbox One, 1 = PS4, 2 = Xbox 360, 3 = PS3, 4 = Switch, 5 = 360 (MW)
FirstControlDevice = 0                                    ; 0 = Keyboard, 1 = Controller -- for setting the first state
UseDynamicFEngSwitching = 1                               ; enable/disable dynamic FEng switching for button icons
EnableSplashTakeover = 1                                  ; splash screen continue button text takeover
ButtonTexFilename = GLOBAL\XtendedInputNGButtons.tpk
