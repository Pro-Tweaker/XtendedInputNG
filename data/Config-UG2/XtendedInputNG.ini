[Input]
Backend = SDL                                              ; gamepad API: SDL (default, also reads DualShock/DualSense, Switch Pro, etc; needs scripts/SDL3.dll, falls back to XInput if missing) or XInput
IgnoreDevices =                                            ; SDL only: VID/PID pairs to hide, e.g. 0x045e/0x028e hides a wrapper's (Steam Input, DS4Windows) virtual Xbox pad when the real pad shows up twice. Empty = hide nothing
KeyboardReadingMode = 0                                    ; 0 = async unbuffered, 1 = buffered (2 = raw unbuffered is not available yet and reads like 0)
XInputOmniMode = 0                                         ; reads from all 4 pads at the same time to the player 1 and 2 inputs

[Deadzone]
; set the percentage of deadzone for each stick here (default 24% = 0.24)
RadialDeadzone = 1                                         ; 1 = circular deadzone, stick range rescaled to full (diagonals reach 1.0); 0 = old per-axis cut
PercentLS = 0.24                                           ; left stick deadzone
PercentRS = 0.24                                           ; right stick deadzone
PercentLS_P2 = 0.24                                        ; left stick deadzone (Port 2)
PercentRS_P2 = 0.24                                        ; right stick deadzone (Port 2)
Percent_Shifting = 0.75                                    ; deadzone for shifting digital activation
Percent_AnalogStickDigital = 0.50                          ; deadzone for analog sticks digital activation
Percent_AnalogTriggerDigital = 0.12                        ; same for triggers

[Camera]
; right-stick orbit of the chase camera. Turn the Widescreen Fix's own [CAMERA] Enable off (= 0) when using this, they can't both run
Enable = 1                                                 ; 1 = enable
StickLookSensitivity = 1.0                                 ; degrees per frame (at 60 fps) at full deflection
ReturnTimeout = 3.0                                        ; seconds without input before the camera swings back behind the car
ReturnSpeed = 2.0
InvertLook = 0
OnlyAllowHorizontalStickMovement = 0                       ; 1 = left/right only. Axes already bound to a driving action (e.g. up/down = shifting in the default bindings) are skipped automatically
ReturnOnRelease = 0                                        ; 1 = camera swings straight back behind the car when you let go of the stick (ignores ReturnTimeout)
MouseLook = 0                                              ; 1 = the mouse orbits the camera too (the cursor is held at the window centre while driving)
MouseLookSensitivity = 1.0
StickCurve = 1.0                                           ; 1 = linear, 2 = finer control near the centre of the stick
PitchMin = -30                                             ; vertical limits in degrees relative to the game's own camera
PitchMax = 60
RecenterOnStickClick = 1                                   ; pressing the right stick (R3) snaps the camera back, if R3 has no other binding
Debug = 0                                                  ; 1 = write camera mode/stick values to the log once a second

[Rumble]
; the game's own force feedback (surface, tire slip and bump effects it normally sends to a wheel) drives the pad motors
Enable = 1                                                 ; 1 = enable
Strength = 1.0                                             ; overall scale, 0 turns everything off
Road = 1.0                                                 ; scale of the road surface rumble
Impact = 1.0                                               ; scale of the bump and tire slip pulses
NOS = 0.5                                                  ; rumble while the nitro button is held and the car is moving
Speed = 0.15                                               ; slight rumble at high speed
SpeedStart = 150                                           ; km/h where the speed rumble begins ...
SpeedFull = 280                                            ; ... and where it reaches its full level
Drift = 0.5                                                ; rumble while the car slides sideways (measured from the car's sideways acceleration)
DriftStart = 7                                             ; sideways acceleration (m/s2) where the drift rumble begins ...
DriftFull = 13                                             ; ... and where it reaches its full level
Handbrake = 0.6                                            ; rumble while the handbrake is held at speed
NosField =                                                 ; optional: where the car keeps its nitrous (e.g. 0x3C4 or 0x40:0x3C4). Not known yet, so empty: the nitro rumble follows the button
Debug = 0                                                  ; 1 = log the effect values the game asks for once a second

[Triggers]
; DualSense adaptive triggers (needs Backend = SDL and a PS5 pad, other pads ignore this)
; Enable: 1 = enable. OnlyWhileRacing: 0 = also in menus
Enable = 0
OnlyWhileRacing = 1
; effects: Off | Feedback <pos 0-9> <strength 1-8> | Weapon <start 2-7> <end 3-8> <strength 1-8> | Vibration <pos 0-9> <amplitude 1-8> <frequency 1-255> | Slope <start 0-8> <end 1-9> <start strength 1-8> <end strength 1-8>
; LeftTrigger = brake: resistance that builds up the further you pull. RightTrigger = throttle: light resistance in the second half of the pull
LeftTrigger = Slope 1 8 2 7
RightTrigger = Feedback 4 2

[Icons]
ControllerIconMode = -1                                    ; button names in the menu hints: -1 = follow the connected pad (SDL backend), 0 = Xbox (A, B, X, Y), 1 = PlayStation (Cross, Circle, Square, Triangle)
FirstControlDevice = 0                                     ; 0 = keyboard, 1 = controller -- which device the hints start with
ShowButtonHints = 1                                        ; 1 = menu texts get the pad button in front of them, e.g. "(A) Continue", while a pad is in use
ShowKeyboardHints = 0                                      ; 1 = same with the key while the keyboard is in use, e.g. "[Enter] Continue"

